<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document & Image Converter</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #1a73e8; font-size: 24px; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #1a73e8; border-radius: 10px; padding: 30px 20px; background-color: #f8f9fa; cursor: pointer; margin-bottom: 20px; transition: background 0.3s; }
        .upload-area:hover { background-color: #e8f0fe; }
        .upload-area p { margin: 0; color: #1a73e8; font-weight: bold; }
        input[type="file"] { display: none; }
        .format-section { text-align: left; margin-bottom: 20px; }
        label { font-weight: bold; color: #333; font-size: 14px; }
        select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; background: #fff; }
        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        button:disabled { background-color: #a0c3f7; cursor: not-allowed; }
        .progress-bar { width: 100%; background-color: #e0e0e0; border-radius: 8px; margin-top: 20px; display: none; overflow: hidden; }
        .progress { width: 0%; height: 20px; background-color: #34a853; transition: width 0.3s; }
        .file-info { margin-top: 10px; font-size: 13px; color: #555; word-break: break-all; }
        #imagePreview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 15px; display: none; }
        #downloadArea { display: none; margin-top: 20px; }
        #downloadBtn { background-color: #34a853; text-decoration: none; display: block; padding: 15px; color: white; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📄 Document & Image Converter</h1>
        <p>Convert PDF, Word, JPG, and PNG files instantly.</p>
        
        <label for="fileInput" class="upload-area" id="dropZone">
            <p>📁 Tap here to select a Document or Image</p>
            <div class="file-info" id="fileName">No file selected</div>
            <img id="imagePreview" src="" alt="Preview">
        </label>
        <input type="file" id="fileInput" accept=".pdf, .doc, .docx, .txt, .jpg, .jpeg, .png, .webp">
        
        <div class="format-section">
            <label>Convert To:</label>
            <select id="formatSelect">
                <optgroup label="Documents">
                    <option value="pdf">PDF Document</option>
                    <option value="docx">Word Document (.docx)</option>
                    <option value="txt">Text File (.txt)</option>
                </optgroup>
                <optgroup label="Images">
                    <option value="jpg">Image - JPG</option>
                    <option value="png">Image - PNG</option>
                </optgroup>
            </select>
        </div>
        
        <button id="convertBtn" onclick="startConversion()">Convert File</button>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="downloadArea">
            <a id="downloadBtn" href="#" target="_blank">⬇️ Download Converted File</a>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const imagePreview = document.getElementById('imagePreview');
        const convertBtn = document.getElementById('convertBtn');
        const progressBar = document.getElementById('progressBar');
        const progress = document.getElementById('progress');
        const downloadArea = document.getElementById('downloadArea');
        const downloadBtn = document.getElementById('downloadBtn');

        let selectedFile = null;

        // ⚠️ DELETE YOUR OLD KEY AND PASTE YOUR NEW KEY HERE:
        const API_KEY = "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJhdWQiOiIxIiwianRpIjoiZDVhMDljOGVkODQ2NzVkZWNhMmJjNWNhZWExMzk1YzFmMGI4NzEzOTM2YTk3ZDA2N2VkYjRlNjZhNzdkYjYzODQ2MDY1YWFiMjUyMzQyMWIiLCJpYXQiOjE3OTM0ODYzNzIuMjYxNTgxLCJuYmYiOjE3OTM0ODYzNzIuMjYxNTgyLCJleHAiOjQ5NDkxNTk5NzIuMjUxODU3LCJzdWIiOiI3NzUxMDM1OSIsInNjb3BlcyI6WyJ1c2VyLnJlYWQiLCJ0YXNrLnJlYWQiLCJ0YXNrLndyaXRlIl19.hxMMxnZKwjdK8RP8-y8nAl6KYUSd8MIa9dndD4HdsD6vHq4PxqksNsBbs0U-G8fLKqNIt3SBEDpRT75ADku4A2sQcvFqZXd4Vu_4VMEttwSYmVOJLjBLk8Ed6_3jUf82v05IcH60KH_nqE7VnnIOCV7Ws5LzmzjybuO6Z6SWh06g74uMF-R5dGM9R6f70Sa00yqWtryWrfL_58x0UdxZG949gxk3yMSxz96RihGfXYdBP-2Di2zoJafh287yUCt-il-HWKNslvA2gYxpou7UePRog6gF3LzyIqhQpKKMZLteqBWZTUT2dFbVD0NSI61qnSdysHkXSV13SWjVik5ueZfNZdHP7M1_YanEmdwgl4c5xEOWAcSPExHBeofnV-LtZfZiLICcSb_zBYiXiHZm8stmYMeAhBoDIxtDIets0csJPlPSqQKxN_WiHWCC5X50yM1A6q6BP9Dahni1E9LZt_lmZGOdjavRlGG20zNC7nOQs5UEO0evekxvsLWzb_5oG6Po7KoSZiAxDONS8qD6c8GDjmqodC0cKRWnX9YxqbgL4cFUR32j0kVBepHMjV2gkwWhlsqhEPJ1csqaQL4ncP7ktZVCfwCTy1I1J8uJLLI01P05XKJ98f5IyeFE681C0VeMntQdDPLax-74LzBB_MTqhBNjwyiJVYd0Z0Tf6B0"; 

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                const sizeInMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
                fileNameDisplay.innerHTML = `<strong>${selectedFile.name}</strong> (${sizeInMB} MB)`;
                downloadArea.style.display = 'none';
                
                if (selectedFile.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        imagePreview.src = event.target.result;
                        imagePreview.style.display = 'block';
                    };
                    reader.readAsDataURL(selectedFile);
                } else { imagePreview.style.display = 'none'; }
            }
        });

        async function startConversion() {
            if (!selectedFile) { alert("Please select a file first!"); return; }
            if (API_KEY === "YOUR_API_KEY_HERE") { alert("Please add your CloudConvert API key to the code first!"); return; }

            const targetFormat = document.getElementById('formatSelect').value;
            
            progressBar.style.display = 'block';
            progress.style.width = '20%';
            convertBtn.disabled = true;
            convertBtn.innerText = "Uploading to CloudConvert...";
            downloadArea.style.display = 'none';

            try {
                // 1. Create a Job
                const jobRes = await fetch('https://api.cloudconvert.com/v2/jobs', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tasks: {
                            'import-file': { operation: 'import/upload' },
                            'convert-file': {
                                operation: 'convert',
                                input: 'import-file',
                                output_format: targetFormat
                            },
                            'export-file': {
                                operation: 'export/url',
                                input: 'convert-file'
                            }
                        }
                    })
                });

                const jobData = await jobRes.json();
                if (jobData.code) throw new Error(jobData.message);

                const jobId = jobData.data.id;
                const uploadTask = jobData.data.tasks.find(t => t.name === 'import-file');
                const uploadUrl = uploadTask.result.form.url;
                const uploadParams = uploadTask.result.form.parameters;

                // 2. Upload the file
                convertBtn.innerText = "Converting file...";
                progress.style.width = '50%';

                const formData = new FormData();
                for (const key in uploadParams) { formData.append(key, uploadParams[key]); }
                formData.append('file', selectedFile);

                await fetch(uploadUrl, { method: 'POST', body: formData });

                // 3. Wait for conversion to finish
                progress.style.width = '75%';
                let exportTask;
                while (true) {
                    const statusRes = await fetch(`https://api.cloudconvert.com/v2/jobs/${jobId}`, {
                        headers: { 'Authorization': `Bearer ${API_KEY}` }
                    });
                    const statusData = await statusRes.json();
                    const status = statusData.data.status;

                    if (status === 'finished') {
                        exportTask = statusData.data.tasks.find(t => t.name === 'export-file');
                        break;
                    } else if (status === 'error') {
                        throw new Error("Conversion failed on the server.");
                    }
                    await new Promise(r => setTimeout(r, 1500)); // Wait 1.5 seconds before checking again
                }

                // 4. Success! Show download button
                progress.style.width = '100%';
                convertBtn.innerText = "Conversion Complete! ✅";
                convertBtn.style.backgroundColor = "#34a853";
                
                const downloadUrl = exportTask.result.files[0].url;
                downloadBtn.href = downloadUrl;
                downloadArea.style.display = 'block';

            } catch (error) {
                alert("Error: " + error.message);
                convertBtn.innerText = "Convert File";
                convertBtn.style.backgroundColor = "#1a73e8";
                progressBar.style.display = 'none';
            } finally {
                convertBtn.disabled = false;
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progress.style.width = '0%';
                    convertBtn.innerText = "Convert File";
                    convertBtn.style.backgroundColor = "#1a73e8";
                }, 5000);
            }
        }
    </script>
</body>
</html>
